<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Flask 기반 지역별 축제정보 웹 애플리케이션">
    <title>축제ON | 지역별 축제정보</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-background">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M4 21v-7m0 0V5a2 2 0 012-2h2.5l1 1H19a1 1 0 011 1v9a1 1 0 01-1 1h-6.5l-1-1H4z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="app-title">축제ON</h1>
                    <p class="app-subtitle" id="current-date-text">전국 지역별 축제 정보를 한눈에 확인하세요</p>
                </div>
            </div>
            <div class="header-right">
                <div id="db-badge" class="db-badge" title="데이터베이스 연결 상태">
                    <span class="db-dot"></span>
                    <span id="db-name">연결 확인 중...</span>
                </div>
                <button id="btn-open-modal" class="btn-primary" onclick="openFestivalModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    새 축제 등록
                </button>
            </div>
        </header>

        <!-- Stats Overview Cards -->
        <section class="stats-grid" aria-label="축제 통계">
            <div class="stat-card">
                <div class="stat-icon total-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">전체 축제</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon active-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">진행중</span>
                    <span class="stat-value" id="stat-ongoing">0</span>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon completed-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7V3m8 4V3M3 11h18M5 5h14a2 2 0 012 2v12a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/></svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">예정</span>
                    <span class="stat-value" id="stat-upcoming">0</span>
                </div>
            </div>

            <div class="stat-card progress-card">
                <div class="progress-header">
                    <span class="stat-label">진행중 비율</span>
                    <span class="progress-percentage" id="stat-rate">0%</span>
                </div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%;"></div>
                </div>
            </div>
        </section>

        <!-- Quick Add Bar -->
        <section class="quick-add-section">
            <form id="quick-add-form" onsubmit="handleQuickAdd(event)">
                <input type="text" id="quick-add-input" placeholder="축제명을 빠르게 입력하세요 (오늘부터 3일간, Enter로 등록)..." autocomplete="off" required>
                <select id="quick-add-region" title="지역 선택"></select>
                <button type="submit" id="quick-add-btn" class="btn-accent">등록</button>
            </form>
        </section>

        <!-- Control Bar (Filter & Search) -->
        <section class="controls-card">
            <div class="search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search-input" placeholder="축제명, 설명으로 검색..." oninput="handleSearch()">
            </div>

            <div class="filters-group">
                <!-- Status Filter Pills -->
                <div class="pill-group" role="tablist">
                    <button class="pill-btn active" data-status="all" onclick="filterByStatus('all', this)">전체</button>
                    <button class="pill-btn" data-status="ongoing" onclick="filterByStatus('ongoing', this)">진행중</button>
                    <button class="pill-btn" data-status="upcoming" onclick="filterByStatus('upcoming', this)">예정</button>
                    <button class="pill-btn" data-status="ended" onclick="filterByStatus('ended', this)">종료</button>
                </div>

                <!-- Region Dropdown Filter -->
                <select id="filter-region" onchange="applyFilters()" class="select-filter">
                    <option value="all">모든 지역</option>
                </select>

                <!-- Category Dropdown Filter -->
                <select id="filter-category" onchange="applyFilters()" class="select-filter">
                    <option value="all">모든 테마</option>
                </select>

                <button id="btn-clear-ended" class="btn-outline-danger" onclick="clearEndedFestivals()" title="종료된 축제 일괄 삭제">
                    종료 항목 삭제
                </button>
            </div>
        </section>

        <!-- Festival List Area -->
        <main class="todo-list-container">
            <div id="festival-list" class="todo-list">
                <!-- Javascript will dynamically populate cards here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state hidden">
                <div class="empty-illustration">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                        <line x1="9" y1="9" x2="9.01" y2="9"/>
                        <line x1="15" y1="9" x2="15.01" y2="9"/>
                    </svg>
                </div>
                <h3>등록된 축제가 없습니다</h3>
                <p>새로운 지역 축제를 등록하고 정보를 공유해보세요!</p>
            </div>
        </main>
    </div>

    <!-- Add/Edit Festival Modal -->
    <div id="festival-modal" class="modal-overlay hidden" onclick="handleModalBackdropClick(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">새 축제 등록</h2>
                <button class="modal-close-btn" onclick="closeFestivalModal()" aria-label="닫기">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="festival-form" onsubmit="handleModalSubmit(event)">
                <input type="hidden" id="modal-festival-id" value="">

                <div class="form-group">
                    <label for="modal-input-name">축제명 *</label>
                    <input type="text" id="modal-input-name" placeholder="예: 진주남강유등축제" required>
                </div>

                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="modal-input-region">지역 *</label>
                        <select id="modal-input-region" required></select>
                    </div>
                    <div class="form-group flex-1">
                        <label for="modal-input-city">시/군/구</label>
                        <input type="text" id="modal-input-city" placeholder="예: 진주시">
                    </div>
                    <div class="form-group flex-1">
                        <label for="modal-input-category">테마</label>
                        <select id="modal-input-category"></select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="modal-input-start">시작일 *</label>
                        <input type="date" id="modal-input-start" required>
                    </div>
                    <div class="form-group flex-1">
                        <label for="modal-input-end">종료일</label>
                        <input type="date" id="modal-input-end">
                    </div>
                    <div class="form-group flex-1">
                        <label for="modal-input-location">장소</label>
                        <input type="text" id="modal-input-location" placeholder="예: 남강 일원">
                    </div>
                </div>

                <div class="form-group">
                    <label for="modal-input-desc">상세 설명</label>
                    <textarea id="modal-input-desc" rows="3" placeholder="축제 소개나 볼거리를 입력하세요"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-ghost" onclick="closeFestivalModal()">취소</button>
                    <button type="submit" class="btn-primary" id="modal-submit-btn">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="/static/app.js"></script>
</body>
</html>
